[project]
name = "py4amitex"
version = "1.1.0"
description="Parametrize and run AMITEX-FFTP simulations"
readme = "README.md"
authors = [
  { name = "Aldo Marano", email = "aldo.marano@onera.fr" },
  { name = "G. Bareigts", email = "guillame.bareigts@cea.com" },
]

license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.8"

dependencies = [
    "numpy",
    "vtk"
]

[project.urls]
Homepage = "https://github.com/AmitexFFTP/py4amitex"
Documentation = "https://amitexfftp.github.io/py4amitex"
Source = "https://github.com/AmitexFFTP/py4amitex"
Changelog = "https://github.com/AmitexFFTP/py4amitex/blob/main/Changelog.md"


[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11"]
build-backend = "scikit_build_core.build"


[project.optional-dependencies]
test = ["pytest"]
lint = [
  "black",
  "flake8"
]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
# wheel.packages = ["bindings/python/src/amitex"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
AMITEX_TESTS = "OFF"
AMITEX_EXAMPLES = "OFF"
AMITEX_PYTHON = "ON"

[tool.pytest.ini_options]
addopts = [
    "--junitxml=build/test-results-python.xml",
]
testpaths = ["cpp4amitex/bindings/python", "py4amitex/microgen"]

#[tool.cibuildwheel]
#test-command = "pytest {project}/tests"
#test-extras = ["test"]
#test-skip = ["*universal2:arm64"]
#build-verbosity = 1
